<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Calendar icon -->
  <rect x="10" y="20" width="80" height="70" rx="4" fill="none" stroke="#007bff" stroke-width="3"/>
  <!-- Top bar -->
  <rect x="10" y="20" width="80" height="15" rx="4" fill="#007bff"/>
  <!-- Calendar grid -->
  <line x1="10" y1="35" x2="90" y2="35" stroke="#007bff" stroke-width="2"/>
  <line x1="10" y1="50" x2="90" y2="50" stroke="#007bff" stroke-width="2"/>
  <!-- Vertical lines -->
  <line x1="28" y1="35" x2="28" y2="90" stroke="#007bff" stroke-width="1"/>
  <line x1="46" y1="35" x2="46" y2="90" stroke="#007bff" stroke-width="1"/>
  <line x1="64" y1="35" x2="64" y2="90" stroke="#007bff" stroke-width="1"/>
  <line x1="82" y1="35" x2="82" y2="90" stroke="#007bff" stroke-width="1"/>
  <!-- Date circle highlight -->
  <circle cx="37" cy="65" r="5" fill="#007bff"/>
</svg>